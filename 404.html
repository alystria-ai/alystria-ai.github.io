<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost · Alystria</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a1230" />
  <link rel="icon" type="image/svg+xml" href="/assets/lys.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,18..144,300..500,100;1,18..144,300..400,100&family=Figtree:wght@400..600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --ink: #eef1ff; --muted: #b1bbe0; --peach: #f3b9a6; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      text-align: center;
      color: var(--ink);
      font-family: "Figtree", system-ui, sans-serif;
      background:
        radial-gradient(120% 70% at 70% 110%, rgba(243, 185, 166, 0.22), transparent 60%),
        radial-gradient(90% 60% at 10% 100%, rgba(167, 123, 255, 0.18), transparent 60%),
        linear-gradient(180deg, #0a1230 0%, #111c45 45%, #22356d 100%);
    }
    .lys { width: 120px; margin: 0 auto 8px; animation: drift 5s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(111, 231, 255, 0.55)); }
    @keyframes drift { 50% { transform: translate(10px, -10px) rotate(6deg); } }
    h1 {
      margin: 18px 0 8px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      font-variation-settings: "SOFT" 100, "opsz" 144;
      font-size: clamp(48px, 10vw, 96px);
      letter-spacing: -0.03em;
      line-height: 1;
    }
    h1 em { font-style: italic; color: var(--peach); }
    p { margin: 0 auto; max-width: 40ch; color: var(--muted); font-size: 18px; line-height: 1.6; }
    a.btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 24px;
      border-radius: 999px;
      color: #120c2e;
      font-weight: 600;
      text-decoration: none;
      background: linear-gradient(100deg, #6fe7ff, #6aa8ff 30%, #a77bff 60%, #ff7ad9);
    }
    a.btn:focus-visible { outline: 2px solid #6fe7ff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .lys { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="lys" viewBox="-40 -48 80 84" aria-hidden="true">
      <defs>
        <radialGradient id="b" cx=".4" cy=".34" r=".72" fx=".3" fy=".24"><stop offset="0" stop-color="#fff" /><stop offset=".3" stop-color="#d4f8ff" /><stop offset=".6" stop-color="#8ec5ff" /><stop offset=".84" stop-color="#ad8cff" /><stop offset="1" stop-color="#ff8ad8" /></radialGradient>
        <linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe7ff" /><stop offset=".5" stop-color="#a77bff" /><stop offset="1" stop-color="#ff7ad9" /></linearGradient>
      </defs>
      <path d="M2 -24 L9 -46 L13 -22 Z" fill="#bff0ff" />
      <circle r="26" fill="url(#b)" />
      <path d="M-14 -22 q8 -10 20 -4 q-10 -2 -14 6 q-2 -4 -6 -2z M-22 -12 q2 -12 14 -14 q-8 6 -8 14z" fill="url(#m)" />
      <!-- looking around, a little worried -->
      <ellipse cx="-11" cy="3" rx="4" ry="5.2" fill="#1c1442" /><ellipse cx="7" cy="3" rx="4" ry="5.2" fill="#1c1442" />
      <circle cx="-12.4" cy=".6" r="1.4" fill="#fff" /><circle cx="5.6" cy=".6" r="1.4" fill="#fff" />
      <path d="M-16 -6 l6 2 M12 -6 l-6 2" stroke="#1c1442" stroke-width="1.6" stroke-linecap="round" />
      <ellipse cx="-17" cy="12" rx="4" ry="2.2" fill="#ff7ad9" opacity=".45" /><ellipse cx="15" cy="12" rx="4" ry="2.2" fill="#ff7ad9" opacity=".45" />
      <path d="M-5 14 q3 -2.5 6 0" stroke="#1c1442" stroke-width="1.6" fill="none" stroke-linecap="round" />
    </svg>
    <h1>Lys got <em>lost.</em></h1>
    <p>This page doesn't exist, or it wandered off somewhere. Lys looked everywhere. Twice.</p>
    <a class="btn" href="/">Take me home</a>
  </main>
</body>
</html>
